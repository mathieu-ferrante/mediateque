# Garde la base Supabase gratuite éveillée (elle se met en pause après 7 jours sans activité).
name: Anti-pause Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'   # tous les 3 jours vers 8 h (heure de Paris)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "Réponse : $code"
          test "$code" = "200"
